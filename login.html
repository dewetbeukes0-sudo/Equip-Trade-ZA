<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Equip Trade ZA</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f4f4f4;

      color: #222;

    }

    .page {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }

    .card {

      width: 100%;

      max-width: 420px;

      background: white;

      padding: 30px;

      border-radius: 12px;

      box-shadow: 0 8px 24px rgba(0,0,0,0.12);

    }

    h1 {

      margin-top: 0;

      text-align: center;

    }

    p {

      text-align: center;

      color: #666;

    }

    label {

      display: block;

      margin-top: 16px;

      margin-bottom: 6px;

      font-weight: bold;

    }

    input {

      width: 100%;

      padding: 12px;

      border: 1px solid #ccc;

      border-radius: 6px;

      font-size: 16px;

    }

    button {

      width: 100%;

      margin-top: 20px;

      padding: 12px;

      border: none;

      border-radius: 6px;

      background: #d9a21b;

      color: #111;

      font-weight: bold;

      font-size: 16px;

      cursor: pointer;

    }

    .secondary {

      background: #333;

      color: white;

      margin-top: 10px;

    }

    #message {

      margin-top: 18px;

      text-align: center;

      font-weight: bold;

    }

  </style>

</head>

<body>

  <div class="page">

    <div class="card">

      <h1>Equip Trade ZA</h1>

      <p>Seller Login</p>

      <label>Email</label>

      <input type="email" id="email" placeholder="Your email">

      <label>Password</label>

      <input type="password" id="password" placeholder="Your password">

      <button id="loginBtn">Log In</button>

      <button id="signupBtn" class="secondary">Create Account</button>

      <div id="message"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL = "https://lfdxocqqmsgqxsmgftzb.supabase.co";

  const SUPABASE_ANON_KEY = "sb_publishable_21B7UyesBlaTKjiuONKxzw_g46oi80w";

  const supabaseClient = supabase.createClient(

    SUPABASE_URL,

    SUPABASE_ANON_KEY

  );

  const emailInput = document.getElementById("email");

  const passwordInput = document.getElementById("password");

  const message = document.getElementById("message");

  document.getElementById("signupBtn").addEventListener("click", async () => {

    message.textContent = "Creating account...";

    const { data, error } = await supabaseClient.auth.signUp({

      email: emailInput.value,

      password: passwordInput.value

    });

    if (error) {

      message.textContent = error.message;

      return;

    }

    message.textContent =

      "Account created. Check your email if confirmation is required.";

  });

  document.getElementById("loginBtn").addEventListener("click", async () => {

    message.textContent = "Logging in...";

    const { data, error } =

      await supabaseClient.auth.signInWithPassword({

        email: emailInput.value,

        password: passwordInput.value

      });

    if (error) {

      message.textContent = error.message;

      return;

    }

    message.textContent = "Login successful.";

    setTimeout(() => {

      window.location.href = "list-equipment.html";

    }, 800);

  });

</script>
    </div>

  </div>

</body>

</html>
