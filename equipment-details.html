<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Equipment Details | Equip Trade ZA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {

      font-family: Arial, sans-serif;

      margin: 0;

      background: #f4f4f4;

      color: #222;

    }

    .container {

      max-width: 1000px;

      margin: 40px auto;

      padding: 20px;

    }

    .card {

      background: white;

      padding: 25px;

      border-radius: 10px;

    }

    .main-image {

      width: 100%;

      max-height: 500px;

      object-fit: cover;

      border-radius: 8px;

      margin-bottom: 20px;

    }

    .back-link {

      display: inline-block;

      margin-bottom: 20px;

      text-decoration: none;

    }

    .contact-box {

      margin-top: 25px;

      padding: 20px;

      background: #f7f7f7;

      border-radius: 8px;

    }

    .equipment-gallery {

  width: 100%;

  margin-bottom: 20px;

}

.equipment-gallery .main-image {

  width: 100%;

  height: 420px;

  object-fit: contain;

  background: #f3f3f3;

  border-radius: 8px;

}

.gallery-thumbnails {

  display: flex;

  gap: 10px;

  margin-top: 10px;

  flex-wrap: wrap;

}

.gallery-thumb {

  width: 90px;

  height: 70px;

  object-fit: cover;

  border-radius: 6px;

  cursor: pointer;

  border: 2px solid transparent;

}

.gallery-thumb:hover {

  border-color: #f2b705;

}

    .main-image-wrap {

  position: relative;

}

.gallery-arrow {

  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  background: rgba(0, 0, 0, 0.55);

  color: white;

  border: none;

  width: 42px;

  height: 52px;

  font-size: 26px;

  cursor: pointer;

  border-radius: 6px;

  z-index: 2;

}

.gallery-prev {

  left: 12px;

}

.gallery-next {

  right: 12px;

}

.gallery-arrow:hover {

  background: rgba(0, 0, 0, 0.75);

}

.gallery-thumb.active-thumb {

  border-color: #f2b705;

}

  </style>

</head>

<body>

<div class="container">

  <a href="index.html" class="back-link">← Back to Equipment</a>

  <div class="card" id="equipmentDetails">

    <p>Loading equipment...</p>

  </div>

</div>

<script>

 const SUPABASE_URL = "https://lfdxocqqmsgqxsmgftzb.supabase.co";
  
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_21B7UyesBlaTKjiuONKxzw_g46oi80w";

  const supabaseClient = supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY

  );

  async function loadEquipmentDetails() {

    const params = new URLSearchParams(window.location.search);

    const listingId = params.get("id");

    const container = document.getElementById("equipmentDetails");

    if (!listingId) {

      container.innerHTML = "<p>Equipment listing not found.</p>";

      return;

    }

    const { data: listing, error } = await supabaseClient

      .from("equipment_listings")

      .select("*")

      .eq("id", listingId)

      .single();

    if (error || !listing) {

      console.error(error);

      container.innerHTML = "<p>Unable to load this equipment listing.</p>";

      return;

    }

    let image = [];

    if (listing.image_urls) {

      try {

        images = Array.isArray(listing.image_urls)

  ? listing.image_urls

  : JSON.parse(listing.image_urls);

      } catch (e) {

        console.error("Image error:", e);

      }

    }

   let galleryHtml = "";

if (images.length > 0) {

  galleryHtml =

    '<div class="equipment-gallery">' +

      '<div class="main-image-wrap">' +

        '<button class="gallery-arrow gallery-prev" onclick="changeGalleryImage(-1)">&#10094;</button>' +

        '<img id="mainGalleryImage" class="main-image" src="' + images[0] + '" alt="Equipment">' +

        '<button class="gallery-arrow gallery-next" onclick="changeGalleryImage(1)">&#10095;</button>' +

      '</div>' +

      '<div class="gallery-thumbnails">' +

        images.map(function(url, index) {

          return '<img class="gallery-thumb ' + (index === 0 ? 'active-thumb' : '') + '" ' +

                 'src="' + url + '" ' +

                 'alt="Equipment photo" ' +

                 'data-index="' + index + '" ' +

                 'onclick="selectGalleryImage(' + index + ')">';

        }).join('') +

      '</div>' +

    '</div>';

}

    container.innerHTML = `

     ${galleryHtml}

      <h1>${listing.equipment_title || "Equipment"}</h1>

      <p><strong>Listing Type:</strong> ${listing.listing_type || ""}</p>

      <p><strong>Category:</strong> ${listing.category || ""}</p>

      <p><strong>Make:</strong> ${listing.make || ""}</p>

      <p><strong>Model:</strong> ${listing.model || ""}</p>

      <p><strong>Year:</strong> ${listing.year || ""}</p>

      <p><strong>Condition:</strong> ${listing.condition || ""}</p>

      <p><strong>Price:</strong> R${listing.price || ""}</p>

      <p><strong>Location:</strong> ${listing.town_city || ""}, ${listing.province || ""}</p>

      <h3>Description</h3>

      <p>${listing.description || ""}</p>

      <div class="contact-box">

        <h3>Seller Contact Details</h3>

       <p><strong>Name:</strong> ${listing.contact_name || ""}</p>

<p>

  <strong>WhatsApp:</strong>

  <a href="https://wa.me/27${(listing.contact_phone || "").replace(/^0/, "").replace(/\D/g, "")}" target="_blank">

    ${listing.contact_phone || ""}

  </a>

</p>

<p>

  <strong>Email:</strong>

  <a href="mailto:${listing.contact_email || ""}">

    ${listing.contact_email || ""}

  </a>

</p> 

      </div>

    `;

  }

  loadEquipmentDetails();

let currentGalleryIndex = 0;

function selectGalleryImage(index) {

  currentGalleryIndex = index;

  const mainImage = document.getElementById("mainGalleryImage");

  const thumbs = document.querySelectorAll(".gallery-thumb");

  if (!mainImage || !thumbs.length) return;

  mainImage.src = thumbs[index].src;

  thumbs.forEach(function(thumb) {

    thumb.classList.remove("active-thumb");

  });

  thumbs[index].classList.add("active-thumb");

}

function changeGalleryImage(direction) {

  const thumbs = document.querySelectorAll(".gallery-thumb");

  if (!thumbs.length) return;

  currentGalleryIndex += direction;

  if (currentGalleryIndex < 0) {

    currentGalleryIndex = thumbs.length - 1;

  }

  if (currentGalleryIndex >= thumbs.length) {

    currentGalleryIndex = 0;

  }

  selectGalleryImage(currentGalleryIndex);

}  

</script>

</body>

</html>
