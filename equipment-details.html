<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Equipment Details | Equip Trade ZA</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body {

      font-family: Arial, sans-serif;

      margin: 0;

      background: #f4f4f4;

      color: #222;

    }

    .container {

      max-width: 1000px;

      margin: 40px auto;

      padding: 20px;

    }

    .card {

      background: white;

      padding: 25px;

      border-radius: 10px;

    }

    .main-image {

      width: 100%;

      max-height: 500px;

      object-fit: cover;

      border-radius: 8px;

      margin-bottom: 20px;

    }

    .back-link {

      display: inline-block;

      margin-bottom: 20px;

      text-decoration: none;

    }

    .contact-box {

      margin-top: 25px;

      padding: 20px;

      background: #f7f7f7;

      border-radius: 8px;

    }

    .equipment-gallery {

  width: 100%;

  margin-bottom: 20px;

}

.equipment-gallery .main-image {

  width: 100%;

  height: 420px;

  object-fit: contain;

  background: #f3f3f3;

  border-radius: 8px;

}

.gallery-thumbnails {

  display: flex;

  gap: 10px;

  margin-top: 10px;

  flex-wrap: wrap;

}

.gallery-thumb {

  width: 90px;

  height: 70px;

  object-fit: cover;

  border-radius: 6px;

  cursor: pointer;

  border: 2px solid transparent;

}

.gallery-thumb:hover {

  border-color: #f2b705;

}

    .main-image-wrap {

  position: relative;

}

.gallery-arrow {

  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  background: rgba(0, 0, 0, 0.55);

  color: white;

  border: none;

  width: 42px;

  height: 52px;

  font-size: 26px;

  cursor: pointer;

  border-radius: 6px;

  z-index: 2;

}

.gallery-prev {

  left: 12px;

}

.gallery-next {

  right: 12px;

}

.gallery-arrow:hover {

  background: rgba(0, 0, 0, 0.75);

}

.gallery-thumb.active-thumb {

  border-color: #f2b705;

}

.details-card {

  margin-top: 28px;

  background: #fff;

  border-radius: 12px;

  padding: 24px;

  box-shadow: 0 3px 14px rgba(0, 0, 0, 0.08);

}

.details-header {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  gap: 20px;

  margin-bottom: 24px;

}

.details-header h1 {

  margin: 10px 0 0;

}

.details-badge {

  display: inline-block;

  background: #2f3542;

  color: white;

  padding: 7px 12px;

  border-radius: 20px;

  font-weight: bold;

}

.details-price {

  font-size: 28px;

  font-weight: bold;

  white-space: nowrap;

}

.spec-grid {

  display: grid;

  grid-template-columns: repeat(2, 1fr);

  gap: 14px;

  margin-bottom: 24px;

}

.spec-item {

  background: #f6f6f6;

  padding: 14px;

  border-radius: 8px;

}

.spec-item strong {

  display: block;

  margin-bottom: 5px;

}

.description-box {

  margin-bottom: 24px;

}

.description-box h3 {

  margin-bottom: 8px;

}

.contact-box {

  background: #f6f6f6;

  padding: 20px;

  border-radius: 10px;

}

.contact-box h3 {

  margin-top: 0;

}

.contact-box a {

  color: #2f6fc2;

  font-weight: bold;

  text-decoration: none;

}

@media (max-width: 700px) {

  .details-header {

    display: block;

  }

  .details-price {

    margin-top: 15px;

  }

  .spec-grid {

    grid-template-columns: 1fr;

  }

}    

.contact-actions {

  display: flex;

  gap: 12px;

  margin-top: 18px;

  flex-wrap: wrap;

}

.contact-btn {

  display: inline-block;

  padding: 12px 18px;

  border-radius: 8px;

  text-decoration: none;

  font-weight: bold;

}

.whatsapp-btn {

  background: #25D366;

  color: white !important;

}

.email-btn {

  background: #2f3542;

  color: white !important;

}

.contact-btn:hover {

  opacity: 0.88;

}    

 .enquiry-modal {

  display: none;

  position: fixed;

  z-index: 9999;

  left: 0;

  top: 0;

  width: 100%;

  height: 100%;

  background: rgba(0, 0, 0, 0.55);

  align-items: center;

  justify-content: center;

  padding: 20px;

  box-sizing: border-box;

}

.enquiry-modal-content {

  background: white;

  width: 100%;

  max-width: 500px;

  padding: 28px;

  border-radius: 12px;

  position: relative;

  box-sizing: border-box;

}

.enquiry-modal-content h2 {

  margin-top: 0;

}

.enquiry-modal-content label {

  display: block;

  font-weight: bold;

  margin-top: 14px;

  margin-bottom: 5px;

}

.enquiry-modal-content input,

.enquiry-modal-content textarea {

  width: 100%;

  padding: 11px;

  border: 1px solid #ccc;

  border-radius: 6px;

  box-sizing: border-box;

}

.close-enquiry {

  position: absolute;

  top: 10px;

  right: 14px;

  border: none;

  background: none;

  font-size: 28px;

  cursor: pointer;

}

.submit-enquiry-btn,

.enquiry-btn {

  background: #f2b705;

  color: #111;

  border: none;

  padding: 12px 18px;

  border-radius: 8px;

  font-weight: bold;

  cursor: pointer;

}

.submit-enquiry-btn {

  width: 100%;

  margin-top: 18px;

}   

  </style>

</head>

<body>

<div class="container">

  <a href="index.html" class="back-link">← Back to Equipment</a>

  <div class="card" id="equipmentDetails">

    <p>Loading equipment...</p>

  </div>

</div>

<script>

 const SUPABASE_URL = "https://lfdxocqqmsgqxsmgftzb.supabase.co";
  
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_21B7UyesBlaTKjiuONKxzw_g46oi80w";

  const supabaseClient = supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY

  );

  async function loadEquipmentDetails() {

    const params = new URLSearchParams(window.location.search);

    const listingId = params.get("id");

    const container = document.getElementById("equipmentDetails");

    if (!listingId) {

      container.innerHTML = "<p>Equipment listing not found.</p>";

      return;

    }

    const { data: listing, error } = await supabaseClient

      .from("equipment_listings")

      .select("*")

      .eq("id", listingId)

      .single();

    if (error || !listing) {

      console.error(error);

      container.innerHTML = "<p>Unable to load this equipment listing.</p>";

      return;

    }

    let image = [];

    if (listing.image_urls) {

      try {

        images = Array.isArray(listing.image_urls)

  ? listing.image_urls

  : JSON.parse(listing.image_urls);

      } catch (e) {

        console.error("Image error:", e);

      }

    }

   let galleryHtml = "";

if (images.length > 0) {

  galleryHtml =

    '<div class="equipment-gallery">' +

      '<div class="main-image-wrap">' +

        '<button class="gallery-arrow gallery-prev" onclick="changeGalleryImage(-1)">&#10094;</button>' +

        '<img id="mainGalleryImage" class="main-image" src="' + images[0] + '" alt="Equipment">' +

        '<button class="gallery-arrow gallery-next" onclick="changeGalleryImage(1)">&#10095;</button>' +

      '</div>' +

      '<div class="gallery-thumbnails">' +

        images.map(function(url, index) {

          return '<img class="gallery-thumb ' + (index === 0 ? 'active-thumb' : '') + '" ' +

                 'src="' + url + '" ' +

                 'alt="Equipment photo" ' +

                 'data-index="' + index + '" ' +

                 'onclick="selectGalleryImage(' + index + ')">';

        }).join('') +

      '</div>' +

    '</div>';

}

    container.innerHTML = `

     ${galleryHtml}

  <div class="details-card">

  <div class="details-header">

    <div>

      <span class="details-badge">${listing.listing_type || ""}</span>

      <h1>${listing.equipment_title || "Equipment"}</h1>

    </div>

   <div class="details-price">

  R${Number(listing.price || 0).toLocaleString("en-ZA")}

</div>

  </div>

  <div class="spec-grid">

    <div class="spec-item">

      <strong>Category</strong>

      <span>${listing.category || ""}</span>

    </div>

    <div class="spec-item">

      <strong>Make</strong>

      <span>${listing.make || ""}</span>

    </div>

    <div class="spec-item">

      <strong>Model</strong>

      <span>${listing.model || ""}</span>

    </div>

    <div class="spec-item">

      <strong>Year</strong>

      <span>${listing.year || ""}</span>

    </div>

    <div class="spec-item">

      <strong>Condition</strong>

      <span>${listing.condition || ""}</span>

    </div>

    <div class="spec-item">

      <strong>Location</strong>

      <span>${listing.town_city || ""}, ${listing.province || ""}</span>

    </div>

  </div>

  <div class="description-box">

    <h3>Description</h3>

    <p>${listing.description || ""}</p>

  </div>

  <div class="contact-box">

    <h3>Interested in this equipment?</h3>

  <div class="contact-actions">

  <button class="contact-btn enquiry-btn" onclick="openEnquiryForm()">

    Enquire About This Equipment

  </button>

</div>

  </div>

</div>

`;    

  }

  loadEquipmentDetails();

let currentGalleryIndex = 0;

function selectGalleryImage(index) {

  currentGalleryIndex = index;

  const mainImage = document.getElementById("mainGalleryImage");

  const thumbs = document.querySelectorAll(".gallery-thumb");

  if (!mainImage || !thumbs.length) return;

  mainImage.src = thumbs[index].src;

  thumbs.forEach(function(thumb) {

    thumb.classList.remove("active-thumb");

  });

  thumbs[index].classList.add("active-thumb");

}

function changeGalleryImage(direction) {

  const thumbs = document.querySelectorAll(".gallery-thumb");

  if (!thumbs.length) return;

  currentGalleryIndex += direction;

  if (currentGalleryIndex < 0) {

    currentGalleryIndex = thumbs.length - 1;

  }

  if (currentGalleryIndex >= thumbs.length) {

    currentGalleryIndex = 0;

  }

  selectGalleryImage(currentGalleryIndex);

}  

function openEnquiryForm() {

  const modal = document.getElementById("enquiryModal");

  if (modal) {

    modal.style.display = "flex";

  }

}

function closeEnquiryForm() {

  const modal = document.getElementById("enquiryModal");

  if (modal) {

    modal.style.display = "none";

  }

}

window.addEventListener("click", function(event) {

  const modal = document.getElementById("enquiryModal");

  if (event.target === modal) {

    closeEnquiryForm();

  }

});  

document.addEventListener("DOMContentLoaded", function () {

  const enquiryForm = document.getElementById("enquiryForm");

  if (!enquiryForm) return;

  enquiryForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const status = document.getElementById("enquiryStatus");

    const submitButton = enquiryForm.querySelector('button[type="submit"]');

    const params = new URLSearchParams(window.location.search);

    const listingId = params.get("id");

    const buyerName = document.getElementById("buyerName").value.trim();

    const buyerPhone = document.getElementById("buyerPhone").value.trim();

    const buyerEmail = document.getElementById("buyerEmail").value.trim();

    const buyerMessage = document.getElementById("buyerMessage").value.trim();

    submitButton.disabled = true;

    submitButton.textContent = "Sending...";

    status.textContent = "";

    const { error } = await supabaseClient

      .from("enquiries")

      .insert([

        {

          listing_id: Number(listingId),

          buyer_name: buyerName,

          buyer_phone: buyerPhone,

          buyer_email: buyerEmail,

          message: buyerMessage

        }

      ]);

    if (error) {

      console.error("Enquiry error:", error);

      status.textContent = "There was a problem sending your enquiry. Please try again.";

      submitButton.disabled = false;

      submitButton.textContent = "Send Enquiry";

      return;

    }

    status.textContent = "Enquiry sent successfully!";

    enquiryForm.reset();

    submitButton.disabled = false;

    submitButton.textContent = "Send Enquiry";

    setTimeout(function () {

      closeEnquiryForm();

      status.textContent = "";

    }, 1800);

  });

});  

</script>

<div id="enquiryModal" class="enquiry-modal">

  <div class="enquiry-modal-content">

    <button class="close-enquiry" onclick="closeEnquiryForm()">×</button>

    <h2>Enquire About This Equipment</h2>

    <form id="enquiryForm">

      <label for="buyerName">Name</label>

      <input type="text" id="buyerName" required>

      <label for="buyerPhone">Phone Number</label>

      <input type="tel" id="buyerPhone" required>

      <label for="buyerEmail">Email</label>

      <input type="email" id="buyerEmail" required>

      <label for="buyerMessage">Message</label>

      <textarea id="buyerMessage" rows="4" required></textarea>

      <button type="submit" class="submit-enquiry-btn">

        Send Enquiry

      </button>

    </form>

    <p id="enquiryStatus"></p>

  </div>

</div>  

</body>

</html>
